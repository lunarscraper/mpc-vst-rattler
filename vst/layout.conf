# Rattler MPC skin layout: 4 x 2 controls per tab at fixed positions, in the order of the
# Force's eight knobs (qlinks). r=48 and the grid are those of carp 2000 (filmstrip stays well
# below 16384 px; r=60 wandered on the device with the RAT). Frame titles empty: the tab name
# is already in the tab bar. The percussion shares its tab with the envelope that gates it.
# REVERB also holds MODE and the sequencer's start and clock; STEPS and GATES are its eight steps.
# PRESET tab: the knob only browses the 32 slots, LOAD and SAVE act.
# Palette: dark sand panel, bone print, venom-green accents.
style=td3
theme_bg=24221d
theme_panel=35322a
theme_line=181712
theme_ink=f1ecdc
theme_ink_dim=b9b29c
theme_ink_faint=6b6656
theme_accent=b4d335
theme_accent_hi=d9f06a
theme_knob_face=181712
theme_knob_ring=000000
theme_bar=b4d335
theme_seg_active=b4d335
theme_seg_inactive=181712
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=12110d
theme_knob_off=57534a
theme_tab_on=b4d335
theme_tab_on_tx=111111
theme_lcd=14180a
theme_box=1f1d18
theme_btn_bg=f1ecdc
theme_chrome_ink=f1ecdc
theme_go_on=b4d335
theme_go_off=d9f06a
theme_tabs=b4d335

[tab VOICE]
frame x=36 y=88 w=1207 h=624 title=""
popup cx=190 cy=250 w=220 h=48 label="MODEL" key=model
knob cx=490 cy=250 r=48 label="FREQ" key=freq
knob cx=790 cy=250 r=48 label="SPREAD" key=spread
knob cx=1090 cy=250 r=48 label="CHARACTER" key=character
knob cx=190 cy=530 r=48 label="VOICE VOL" key=voice_vol
knob cx=490 cy=530 r=48 label="FREQ MOD" key=fm_depth
popup cx=790 cy=530 w=220 h=48 label="FREQ MOD SOURCE" key=fm_src
knob cx=1090 cy=530 r=48 label="VOLUME" key=volume
qlinks "VOICE" = model,freq,spread,character,voice_vol,fm_depth,fm_src,volume

