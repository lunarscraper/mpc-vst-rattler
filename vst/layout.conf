# Rattler MPC skin layout: 4 x 2 controls per tab at fixed positions, in the order of the
# Force's eight knobs (qlinks). r=48 and the grid are those of carp 2000 (filmstrip stays well
# below 16384 px; r=60 wandered on the device with the RAT). Frame titles empty: the tab name
# is already in the tab bar. The percussion shares its tab with the envelope that gates it.
# PRESET tab: the knob only browses the 32 slots, LOAD and SAVE act.
# Palette: dark sand panel, bone print, venom-green accents.
style=td3
theme_bg=24221d
theme_panel=35322a
theme_line=181712
theme_ink=f1ecdc
theme_ink_dim=b9b29c
theme_ink_faint=6b6656
theme_accent=b4d335
theme_accent_hi=d9f06a
theme_knob_face=181712
theme_knob_ring=000000
theme_bar=b4d335
theme_seg_active=b4d335
theme_seg_inactive=181712
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=12110d
theme_knob_off=57534a
theme_tab_on=b4d335
theme_tab_on_tx=111111
theme_lcd=14180a
theme_box=1f1d18
theme_btn_bg=f1ecdc
theme_chrome_ink=f1ecdc
theme_go_on=b4d335
theme_go_off=d9f06a
theme_tabs=b4d335

[tab VOICE]
frame x=36 y=88 w=1207 h=624 title=""
popup cx=190 cy=250 w=220 h=48 label="MODEL" key=model
knob cx=490 cy=250 r=48 label="FREQ" key=freq
knob cx=790 cy=250 r=48 label="SPREAD" key=spread
knob cx=1090 cy=250 r=48 label="CHARACTER" key=character
knob cx=190 cy=530 r=48 label="VOICE VOL" key=voice_vol
knob cx=490 cy=530 r=48 label="FREQ MOD" key=fm_depth
popup cx=790 cy=530 w=220 h=48 label="FREQ MOD SOURCE" key=fm_src
knob cx=1090 cy=530 r=48 label="VOLUME" key=volume
qlinks "VOICE" = model,freq,spread,character,voice_vol,fm_depth,fm_src,volume

[tab PERC]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="PERC" key=perc
knob cx=490 cy=250 r=48 label="PERC FREQ" key=perc_freq
knob cx=790 cy=250 r=48 label="PERC VOL" key=perc_vol
knob cx=1090 cy=250 r=48 label="VOICE VOL" key=voice_vol
knob cx=190 cy=530 r=48 label="ATTACK" key=attack
knob cx=490 cy=530 r=48 label="DECAY / RELEASE" key=decay
popup cx=790 cy=530 w=220 h=48 label="ENVELOPE" key=env_mode
knob cx=1090 cy=530 r=48 label="VOLUME" key=volume
qlinks "PERC" = perc,perc_freq,perc_vol,voice_vol,attack,decay,env_mode,volume

[tab FILTER]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="VCF 1 CUTOFF" key=f1_cutoff
knob cx=490 cy=250 r=48 label="VCF 1 RES" key=f1_res
knob cx=790 cy=250 r=48 label="VCF 1 ENV MOD" key=f1_mod
popup cx=1090 cy=250 w=220 h=48 label="VCF 1 TYPE" key=f1_type
knob cx=190 cy=530 r=48 label="VCF 2 CUTOFF" key=f2_cutoff
knob cx=490 cy=530 r=48 label="VCF 2 RES" key=f2_res
knob cx=790 cy=530 r=48 label="VCF 2 LFO MOD" key=f2_mod
knob cx=1090 cy=530 r=48 label="LFO SPEED" key=lfo_speed
qlinks "FILTER" = f1_cutoff,f1_res,f1_mod,f1_type,f2_cutoff,f2_res,f2_mod,lfo_speed

[tab LFO]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="SPEED" key=lfo_speed
popup cx=490 cy=250 w=220 h=48 label="SHAPE" key=lfo_shape
knob cx=790 cy=250 r=48 label="SLEW" key=lfo_slew
knob cx=1090 cy=250 r=48 label="VCF 2 LFO MOD" key=f2_mod
knob cx=190 cy=530 r=48 label="FREQ MOD" key=fm_depth
popup cx=490 cy=530 w=220 h=48 label="FREQ MOD SOURCE" key=fm_src
qlinks "LFO" = lfo_speed,lfo_shape,lfo_slew,f2_mod,fm_depth,fm_src

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
button cx=340 cy=390 label="LOAD" key=load
knob cx=640 cy=380 r=48 label="PRESET" key=slot
button cx=940 cy=390 label="SAVE" key=save
qlinks "PRESET" = slot,load,save
