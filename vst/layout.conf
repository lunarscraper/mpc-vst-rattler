font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.25
theme_bg=24221d
theme_panel=35322a
theme_line=181712
theme_ink=f1ecdc
theme_ink_dim=b9b29c
theme_ink_faint=6b6656
